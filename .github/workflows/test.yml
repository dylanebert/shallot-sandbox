name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  cheap:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ["macos-15", "ubuntu-latest", "windows-latest"]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"
      - run: bun install
      - name: cheap tier
        run: bun test --path-ignore-patterns '**/*.gpu.test.ts'

  node:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ["macos-15", "ubuntu-latest", "windows-latest"]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"
      - name: Install Mesa Vulkan driver
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers
      - uses: actions/setup-node@v6
        with:
          node-version: "26"
      - run: bun install
      - name: Run Bun as node.exe
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $hostDir = Join-Path $env:RUNNER_TEMP 'bun-node'
          $realNodeDir = Split-Path (Get-Command node -ErrorAction Stop).Source -Parent
          Add-Content -Path $env:GITHUB_ENV -Value "SHALLOT_REAL_NODE_DIR=$realNodeDir"
          New-Item -ItemType Directory -Force -Path $hostDir | Out-Null
          Copy-Item (Get-Command bun).Source (Join-Path $hostDir 'node.exe')
          Add-Content -Path $env:GITHUB_PATH -Value $hostDir
      - name: Identify WARP adapter
        if: matrix.os == 'windows-latest'
        run: |
          node -e "import('webgpu').then(({ create, globals }) => { Object.assign(globalThis, globals); return create([]).requestAdapter(); }).then((adapter) => { if (!adapter) throw new Error('WARP adapter unavailable'); const info = adapter.info; const identity = [info.vendor, info.architecture, info.device, info.description].join(' '); if (!/warp|basic render/i.test(identity)) throw new Error('Expected WARP, got ' + identity); console.info('WARP adapter:', identity); })"
      - name: node tier
        if: matrix.os != 'windows-latest'
        run: bun test $(find ./src ./tests -name '*.node.ts' -print | sort)
      - name: node tier on WARP
        if: matrix.os == 'windows-latest'
        run: |
          node -e "const child = Bun.spawn([process.execPath, 'test', ...process.argv.slice(1)], { argv0: 'bun.exe', env: { ...process.env, PATH: process.env.SHALLOT_REAL_NODE_DIR + ';' + process.env.PATH }, stdin: 'inherit', stdout: 'inherit', stderr: 'inherit' }); child.exited.then((code) => process.exit(code));" -- $(find ./src ./tests -name '*.node.ts' -print | sort)

  browser:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ["macos-15", "ubuntu-latest", "windows-latest"]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"
      - name: Install Mesa Vulkan driver
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers
      - run: bun install
      - name: Install Playwright Chromium
        run: bunx playwright install chromium
      - name: browser tier
        run: bunx playwright test
